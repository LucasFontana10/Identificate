# ══ Identificate — Netlify config ══

[build]
  publish = "."

# Cache de imágenes: 1 mes
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

# HTML: siempre fresco
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── MODO MANTENIMIENTO ──────────────────────────────────────────
# Solo redirige rutas HTML — los assets (img, etc.) se sirven normalmente.
# Así evitamos el conflicto de múltiples force=true compitiendo.

# Raíz del sitio
[[redirects]]
  from   = "/"
  to     = "/working.html"
  status = 200
  force  = true

# Cualquier ruta con extensión .html (turnera.html, index.html, etc.)
[[redirects]]
  from   = "/*.html"
  to     = "/working.html"
  status = 200
  force  = true

# Rutas sin extensión (por si usan URLs limpias)
[[redirects]]
  from   = "/*"
  to     = "/working.html"
  status = 200

# ── PRODUCCIÓN (activar cuando esté listo) ──────────────────────
# Borrar los 3 bloques de arriba y descomentar esto:
# [[redirects]]
#   from   = "/*"
#   to     = "/404.html"
#   status = 404
