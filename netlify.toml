# ══ Identificate — Netlify config ══

[build]
  publish = "."

# Cache de imágenes: 1 mes
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

# HTML: siempre fresco
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── MODO MANTENIMIENTO ──────────────────────────────────────────
# Muestra 404.html en todas las URLs mientras se prepara el sitio.
# Cuando el sitio esté listo: borrar este bloque y dejar solo el de abajo.
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 200        # 200 = rewrite silencioso (URL no cambia)
  force  = true       # fuerza incluso sobre archivos existentes

# ── PRODUCCIÓN (activar cuando esté listo) ──────────────────────
# [[redirects]]
#   from   = "/*"
#   to     = "/404.html"
#   status = 404
