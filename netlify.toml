# ══ Identificate — Netlify config ══

[build]
  publish = "."

# Cache de imágenes: 1 mes
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

# HTML: siempre fresco
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── MODO MANTENIMIENTO ──────────────────────────────────────────
# Passthrough para assets estáticos — va ANTES del catch-all.
# force=true acá también para tener precedencia sobre el force del catch-all.
[[redirects]]
  from  = "/img/*"
  to    = "/img/:splat"
  status = 200
  force  = true

# Redirige todo el tráfico a working.html mientras el sitio está en construcción.
# Cuando el sitio esté listo: reemplazar este bloque por el de PRODUCCIÓN de abajo.
[[redirects]]
  from   = "/*"
  to     = "/working.html"
  status = 200        # 200 = rewrite silencioso (URL no cambia)
  force  = true       # fuerza incluso sobre archivos existentes

# ── PRODUCCIÓN (activar cuando esté listo) ──────────────────────
# Eliminar el bloque MANTENIMIENTO de arriba y descomentar esto:
# [[redirects]]
#   from   = "/*"
#   to     = "/404.html"
#   status = 404
